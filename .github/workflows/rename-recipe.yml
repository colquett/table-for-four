name: Rename recipe file
on: workflow_dispatch
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename recipe file
        run: |
          git config user.name "colquett"
          git config user.email "colqutd@gmail.com"
          git mv hamburger-steak-with-onion-gravy.html hamburger-steak-onion-gravy.html
          git commit -m "Rename recipe file to hamburger-steak-onion-gravy.html"
          git push
