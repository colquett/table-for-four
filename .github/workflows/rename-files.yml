name: Rename uploaded files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename files and commit
        run: |
          mv recipe-site.html index.html
          mv this-week-s-grocery-deals.html weekly-deals.html
          git config user.name "colquett"
          git config user.email "colqutd@gmail.com"
          git add -A
          git commit -m "Rename recipe-site.html to index.html and this-week-s-grocery-deals.html to weekly-deals.html"
          git push
