name: Rename exported files

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace files with fresh exports
        run: |
          git config user.name "colquett"
          git config user.email "colqutd@gmail.com"
          git rm -q index.html hamburger-steak-onion-gravy.html
          git mv recipe-site.html index.html
          git mv hamburger-steak-with-onion-gravy.html hamburger-steak-onion-gravy.html
          git status --short
          git commit -m "Replace index and recipe page with fresh exports including Google Analytics tag"
          git push
