name: Rename files

on:
  push:
    paths:
      - .github/workflows/rename-files.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with fresh home page export
        run: |
          git config user.name "colquett"
          git config user.email "colquett@users.noreply.github.com"
          if [ -f recipe-site.html ]; then
            mv -f recipe-site.html index.html
            git add -A
            git commit -m "Replace index.html with fresh home page export"
            git push
          fi
