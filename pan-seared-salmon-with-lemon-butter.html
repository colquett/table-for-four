        imageAlt: "Four pan-seared salmon fillets with crispy skin, drizzled with lemon butter sauce and garnished with parsley and lemon slices, with a small bowl of extra sauce",
        serves: 4,
        timeNote: "About 35 minutes",
        tags: ["Fish", "Skillet dinner", "Family of 4"],
        ingredients: [
          { group: "Salmon & lemon butter" },
          { qty: 4, unit: "", name: "salmon fillets", prep: "skin-on, about 6 oz each (1½ lb total)" },
          { qty: 1, unit: "tsp", name: "kosher salt", note: "¾ tsp if using table salt" },
          { qty: 0.5, unit: "tsp", name: "black pepper" },
          { qty: 0.5, unit: "tsp", name: "garlic powder" },
          { qty: 1, unit: "tbsp", name: "olive oil" },
          { qty: 4, unit: "tbsp", name: "butter" },
          { qty: 3, unit: "cloves", name: "garlic", prep: "minced" },
          { qty: 1, unit: "", name: "lemon", prep: "zested and juiced (about 2 tbsp juice), plus extra slices for serving" },
          { qty: 2, unit: "tbsp", name: "fresh parsley", prep: "chopped, for serving" },
          { group: "For serving" },
          { qty: 1.5, unit: "lb", name: "Brussels sprouts", prep: "trimmed and halved" },
          { qty: 1.5, unit: "lb", name: "gold potatoes", prep: "cut into ¾-inch chunks" },
          { qty: 2, unit: "tbsp", name: "olive oil", prep: "for the vegetables" },
          { qty: null, unit: "", name: "Salt and pepper", prep: "to taste, for the vegetables" }
        ],
        steps: [
          "Heat the oven to <span class='time'>425°F</span>. Toss the Brussels sprouts and potatoes with 2 tbsp olive oil, salt, and pepper. Spread them in a single layer on a large sheet pan — cut sides down for the sprouts — and roast for <span class='time'>25–28 minutes</span>, flipping once halfway, until the potatoes are tender and both are browned at the edges.",
          "While the vegetables roast, take the salmon out of the fridge. Pat both sides very dry with paper towels — this is what makes the skin crisp. Season the flesh side with the salt, pepper, and garlic powder.",
          "Heat 1 tbsp olive oil in a large skillet (cast iron or stainless steel) over medium-high heat until it just starts to shimmer. Lay the fillets in skin-side down, away from you, and press each one gently with a spatula for <span class='time'>10 seconds</span> so the skin makes full contact.",
          "Cook undisturbed for <span class='time'>6–7 minutes</span>. Don't move them — the skin will release on its own when it's crisp. You'll see the flesh turn opaque about two-thirds of the way up the side.",
          "Flip the fillets and cook <span class='time'>1–2 minutes</span> more, until the center is just opaque and flakes easily — about 125–130°F for medium, or cook to 145°F if you prefer it fully firm. Transfer to plates, skin-side up, and rest while you make the sauce.",
          "Reduce the heat to low. Add the butter to the same skillet and let it melt, scraping up any browned bits. Add the minced garlic and cook for <span class='time'>30 seconds</span>, just until fragrant.",
          "Take the skillet off the heat. Stir in the lemon zest and lemon juice and swirl until the sauce looks glossy. Taste and add a pinch of salt if needed.",
          "Spoon the lemon butter over and around the salmon, scatter with parsley, and serve right away with the roasted Brussels sprouts and potatoes and extra lemon slices on the side."
        ],
        notes: [
          "Dry fish, hot pan, no moving it — those three things are the whole secret to crispy skin. If a fillet sticks when you try to peek, it isn't ready yet; give it another minute and it will let go.",
          "Serve the salmon skin-side up and spoon the sauce around it, not over the skin, if you want the skin to stay crisp at the table. A little sauce over the top is fine if you're eating right away.",
          "Starting from a big Kirkland salmon side or a multi-pack of fillets? Cut it into 4 even portions of about 6 oz each before cooking so they all finish at the same time, and check the thin tail piece a minute early.",
          "Skinless fillets work too: sear 4–5 minutes on the first side and 1–2 minutes on the second. The fish just won't have the crispy skin.",
          "Leftovers keep 2 days in the fridge. Eat them cold flaked over a salad, or reheat gently in a covered skillet on low — the microwave tends to toughen salmon."
        ]
      };

      var FRACTIONS = [
        [0.125, "⅛"], [0.25, "¼"], [1 / 3, "⅓"], [0.375, "⅜"],
        [0.5, "½"], [0.625, "⅝"], [2 / 3, "⅔"], [0.75, "¾"], [0.875, "⅞"]
      ];
      function fmtQty(n) {
        if (n == null) return "";
        var whole = Math.floor(n);
        var frac = n - whole;
        var best = "", bestDiff = 0.06;
        for (var i = 0; i < FRACTIONS.length; i++) {
          var d = Math.abs(frac - FRACTIONS[i][0]);
          if (d < bestDiff) { bestDiff = d; best = FRACTIONS[i][1]; }
        }
        if (best) return (whole > 0 ? whole : "") + best;
        if (frac > 0.94) return String(whole + 1);
        var rounded = Math.round(n * 100) / 100;
        return String(rounded);
      }

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      var currentFactor = 1;

      function ingredientLine(ing, factor) {
        var qtyText = "";
        if (ing.qty != null) qtyText = fmtQty(ing.qty * factor);
        else if (ing.qtyMin != null) qtyText = fmtQty(ing.qtyMin * factor) + "–" + fmtQty(ing.qtyMax * factor);
        var parts = [];
        if (qtyText) parts.push('<span class="qty">' + qtyText + (ing.unit ? " " + esc(ing.unit) : "") + "</span>");
        var label = esc(ing.name);
        if (ing.prep) label += ", " + esc(ing.prep);
        parts.push(label);
        var html = parts.join(" ");
        if (ing.note) html += ' <span class="note">(' + esc(ing.note) + ")</span>";
        return html;
      }

      function renderIngredients() {
        var list = document.getElementById("ingredients-list");
        if (!list) return;
        var html = "";
        RECIPE.ingredients.forEach(function (ing) {
          if (ing.group) {
            html += '<li class="ing-group" style="border-bottom:none;padding-bottom:0;">' + esc(ing.group) + "</li>";
          } else {
            html += "<li>" + ingredientLine(ing, currentFactor) + "</li>";
          }
        });
        list.innerHTML = html;
        var servesLabel = document.getElementById("serves-label");
        if (servesLabel) servesLabel.textContent = "Serves " + Math.round(RECIPE.serves * currentFactor);
        var buttons = document.querySelectorAll(".segmented button");
        buttons.forEach(function (b) {
          b.setAttribute("aria-pressed", String(parseFloat(b.getAttribute("data-factor")) === currentFactor));
        });
      }

      function renderRecipe() {
        var r = RECIPE;
        var el = document.getElementById("recipe-article");
        el.innerHTML =
          '<div class="recipe-head">' +
            "<h1>" + esc(r.title) + "</h1>" +
            '<p class="lede">' + esc(r.lede) + "</p>" +
          "</div>" +
          '<img class="hero-img" src="' + r.image + '" alt="' + esc(r.imageAlt) + '" />' +
          '<div class="recipe-meta">' +
            '<span class="chip" id="serves-label">Serves ' + r.serves + "</span>" +
            '<span class="chip">' + esc(r.timeNote) + "</span>" +
            r.tags.map(function (t) { return '<span class="chip sage">' + esc(t) + "</span>"; }).join("") +
          "</div>" +
          '<div class="recipe-cols">' +
            '<section class="panel" aria-label="Ingredients">' +
              "<h2>Ingredients</h2>" +
              '<div class="scaler">' +
                '<span class="scaler-label" id="scaler-label">Scale recipe</span>' +
                '<div class="segmented" role="group" aria-labelledby="scaler-label">' +
                  '<button type="button" data-factor="0.5" aria-pressed="false">½×</button>' +
                  '<button type="button" data-factor="1" aria-pressed="true">1×</button>' +
                  '<button type="button" data-factor="2" aria-pressed="false">2×</button>' +
                "</div>" +
              "</div>" +
              '<ul class="ingredients" id="ingredients-list"></ul>' +
            "</section>" +
            '<section class="steps-block" aria-label="Instructions">' +
              "<h2>Instructions</h2>" +
              '<ol class="steps">' +
                r.steps.map(function (s) { return "<li>" + s + "</li>"; }).join("") +
              "</ol>" +
              '<div class="notes-block">' +
                "<h2>Notes &amp; tips</h2>" +
                "<ul>" + r.notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul>" +
              "</div>" +
            "</section>" +
          "</div>";
        renderIngredients();
        var buttons = el.querySelectorAll(".segmented button");
        buttons.forEach(function (b) {
          b.addEventListener("click", function () {
            currentFactor = parseFloat(b.getAttribute("data-factor"));
            renderIngredients();
          });
        });
      }

      renderRecipe();
    </script>
