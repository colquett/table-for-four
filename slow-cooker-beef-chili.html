        imageAlt: "A bowl of slow-cooker beef chili with beans, topped with shredded cheddar, sour cream, and sliced green onions, with cornbread muffins and the slow cooker alongside",
        serves: 4,
        timeNote: "20 min prep · 6–7 hrs on Low",
        tags: ["Beef", "Slow cooker", "Family of 4"],
        ingredients: [
          { group: "Chili" },
          { qty: 2, unit: "lb", name: "ground beef", note: "73% lean is fine here — you drain it" },
          { qty: 1, unit: "", name: "large yellow onion", prep: "diced" },
          { qty: 2, unit: "", name: "bell peppers", prep: "diced — the tricolor pack is perfect; use any two colors" },
          { qty: 4, unit: "cloves", name: "garlic", prep: "minced" },
          { qty: 3, unit: "tbsp", name: "chili powder" },
          { qty: 2, unit: "tsp", name: "ground cumin" },
          { qty: 1, unit: "tsp", name: "smoked paprika", note: "regular paprika works too" },
          { qty: 1, unit: "tsp", name: "dried oregano" },
          { qty: 1.5, unit: "tsp", name: "kosher salt", note: "scant 1¼ tsp if using table salt; more to taste at the end" },
          { qty: 0.5, unit: "tsp", name: "black pepper" },
          { qty: 0.25, unit: "tsp", name: "cayenne pepper", prep: "optional, for heat" },
          { qty: 2, unit: "tbsp", name: "tomato paste" },
          { qty: 2, unit: "", name: "(14.5 oz) cans diced tomatoes", prep: "undrained — Hunt's is what we used" },
          { qty: 0.75, unit: "cup", name: "beef broth", note: "water works in a pinch" },
          { qty: 1, unit: "tbsp", name: "Worcestershire sauce", prep: "optional" },
          { qty: 1, unit: "tsp", name: "brown sugar", prep: "optional — rounds out the tomato acidity" },
          { qty: 1, unit: "", name: "(15 oz) can dark red kidney beans", prep: "drained and rinsed" },
          { qty: 1, unit: "", name: "(15 oz) can black beans", prep: "drained and rinsed" },
          { group: "Cornbread & serving" },
          { qty: 1, unit: "", name: "(8.5 oz) box corn muffin mix", prep: "plus the egg and milk called for on the box" },
          { qty: null, unit: "", name: "Shredded cheddar, sour cream & sliced green onions", prep: "for topping" }
        ],
        steps: [
          "Heat a large skillet over medium-high heat. Add the ground beef and cook, breaking it into small crumbles, for <span class='time'>6–8 minutes</span>, until no pink remains and the meat is browned in spots. Drain off all but about 1 tablespoon of the fat.",
          "Add the onion and bell peppers to the same skillet and cook for <span class='time'>4–5 minutes</span>, until softened. Stir in the garlic, chili powder, cumin, smoked paprika, oregano, salt, black pepper, cayenne (if using), and tomato paste, and cook for <span class='time'>1 minute</span>, until the spices are dark and fragrant — this little toasting step is where a lot of the flavor comes from.",
          "Scrape everything into a 5- to 6-quart slow cooker. Stir in the diced tomatoes with all their juices, the beef broth, the Worcestershire sauce and brown sugar (if using), and both cans of beans.",
          "Cover and cook on <span class='time'>Low for 6–7 hours</span> or on <span class='time'>High for 3–4 hours</span>, until the chili is thick, dark, and rich and the peppers are completely tender. Leave the lid on — every peek lets out heat and adds cooking time.",
          "About <span class='time'>30 minutes</span> before serving, bake the cornbread according to the package directions. Skim any fat from the top of the chili, then taste and add more salt if it needs it. If the chili is thinner than you like, take the lid off and let it go on High for <span class='time'>20–30 minutes</span>; if it's too thick, stir in a splash of broth.",
          "Ladle into bowls and top with shredded cheddar, a spoonful of sour cream, and sliced green onions. Serve with warm cornbread on the side."
        ],
        notes: [
          "Don't skip the skillet. Browning the beef and toasting the spices first is the difference between chili that tastes slow-cooked and chili that tastes boiled — and with 73% lean beef, it's also how you drain off the extra fat before it ever hits the cooker.",
          "Get a head start: brown the beef and vegetables the night before, let the skillet mixture cool, and refrigerate it in the slow-cooker insert (or a covered bowl). In the morning, add the tomatoes, broth, and beans, turn it on Low, and dinner is handled — especially handy in a week when the oven has other plans.",
          "Heat, your way: as written, this is a mild, family-friendly chili with warmth from the chili powder but no real burn. For more heat, double the cayenne or stir in a diced jalapeño with the peppers. For none at all, leave the cayenne out entirely.",
          "This week's beef is the 5-lb roll, and the recipe uses 2 lb of it. Freeze the remaining 3 lb raw in 1- to 1½-lb portions, flattened in zip-top bags — they thaw fast and stack neatly.",
          "Chili is better on day two. Leftovers keep 4 days in the fridge and freeze well for up to 3 months. Thaw overnight and reheat gently on the stove with a splash of water or broth, since it thickens as it sits.",
          "No slow cooker? A heavy pot with a lid on the stove over the lowest heat works — give it 1½ to 2 hours, stir every 20 minutes or so, and add a little more broth if it catches on the bottom."
        ],
        dealNote: "Built from this week's deals (checked Nov 22, 2026): ground beef 73% 5-lb roll $19.94 ($3.99/lb) on Walmart rollback; Hunt's tomatoes BOGO $3.09, tricolor peppers 3 ct $3.99, and yellow onions 3-lb bag $3.99 at Publix (ad 11/18–11/24)."
      };

      var FRACTIONS = [
        [0.125, "⅛"], [0.25, "¼"], [1 / 3, "⅓"], [0.375, "⅜"],
        [0.5, "½"], [0.625, "⅝"], [2 / 3, "⅔"], [0.75, "¾"], [0.875, "⅞"]
      ];
      function fmtQty(n) {
        if (n == null) return "";
        var whole = Math.floor(n);
        var frac = n - whole;
        var best = "", bestDiff = 0.06;
        for (var i = 0; i < FRACTIONS.length; i++) {
          var d = Math.abs(frac - FRACTIONS[i][0]);
          if (d < bestDiff) { bestDiff = d; best = FRACTIONS[i][1]; }
        }
        if (best) return (whole > 0 ? whole : "") + best;
        if (frac > 0.94) return String(whole + 1);
        var rounded = Math.round(n * 100) / 100;
        return String(rounded);
      }

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      var currentFactor = 1;

      function ingredientLine(ing, factor) {
        var qtyText = "";
        if (ing.qty != null) qtyText = fmtQty(ing.qty * factor);
        else if (ing.qtyMin != null) qtyText = fmtQty(ing.qtyMin * factor) + "–" + fmtQty(ing.qtyMax * factor);
        var parts = [];
        if (qtyText) parts.push('<span class="qty">' + qtyText + (ing.unit ? " " + esc(ing.unit) : "") + "</span>");
        var label = esc(ing.name);
        if (ing.prep) label += ", " + esc(ing.prep);
        parts.push(label);
        var html = parts.join(" ");
        if (ing.note) html += ' <span class="note">(' + esc(ing.note) + ")</span>";
        return html;
      }

      function renderIngredients() {
        var list = document.getElementById("ingredients-list");
        if (!list) return;
        var html = "";
        RECIPE.ingredients.forEach(function (ing) {
          if (ing.group) {
            html += '<li style="border-bottom:none;padding-bottom:0;"><span style="font-family:Bitter,Georgia,serif;font-weight:700;font-size:15px;color:var(--sage);">' + esc(ing.group) + "</span></li>";
          } else {
            html += "<li>" + ingredientLine(ing, currentFactor) + "</li>";
          }
        });
        list.innerHTML = html;
        var servesLabel = document.getElementById("serves-label");
        if (servesLabel) servesLabel.textContent = "Serves " + Math.round(RECIPE.serves * currentFactor);
        var buttons = document.querySelectorAll(".segmented button");
        buttons.forEach(function (b) {
          b.setAttribute("aria-pressed", String(parseFloat(b.getAttribute("data-factor")) === currentFactor));
        });
      }

      function renderRecipe() {
        var r = RECIPE;
        var el = document.getElementById("recipe-article");
        el.innerHTML =
          '<div class="recipe-head">' +
            '<p class="week-line">' + esc(r.week) + "</p>" +
            "<h1>" + esc(r.title) + "</h1>" +
            '<p class="lede">' + esc(r.lede) + "</p>" +
          "</div>" +
          '<img class="hero-img" src="' + r.image + '" alt="' + esc(r.imageAlt) + '" />' +
          '<div class="recipe-meta">' +
            '<span class="chip" id="serves-label">Serves ' + r.serves + "</span>" +
            '<span class="chip">' + esc(r.timeNote) + "</span>" +
            r.tags.map(function (t) { return '<span class="chip sage">' + esc(t) + "</span>"; }).join("") +
          "</div>" +
          '<div class="recipe-cols">' +
            '<section class="panel" aria-label="Ingredients">' +
              "<h2>Ingredients</h2>" +
              '<div class="scaler">' +
                '<span class="scaler-label" id="scaler-label">Scale recipe</span>' +
                '<div class="segmented" role="group" aria-labelledby="scaler-label">' +
                  '<button type="button" data-factor="0.5" aria-pressed="false">½×</button>' +
                  '<button type="button" data-factor="1" aria-pressed="true">1×</button>' +
                  '<button type="button" data-factor="2" aria-pressed="false">2×</button>' +
                "</div>" +
              "</div>" +
              '<ul class="ingredients" id="ingredients-list"></ul>' +
            "</section>" +
            '<section class="steps-block" aria-label="Instructions">' +
              "<h2>Instructions</h2>" +
              '<ol class="steps">' +
                r.steps.map(function (s) { return "<li>" + s + "</li>"; }).join("") +
              "</ol>" +
              '<div class="notes-block">' +
                "<h2>Notes &amp; tips</h2>" +
                "<ul>" + r.notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul>" +
              "</div>" +
              '<p class="deal-note"><strong>This week&rsquo;s shopping:</strong> ' + esc(r.dealNote) + "</p>" +
            "</section>" +
          "</div>";
        renderIngredients();
        var buttons = el.querySelectorAll(".segmented button");
        buttons.forEach(function (b) {
          b.addEventListener("click", function () {
            currentFactor = parseFloat(b.getAttribute("data-factor"));
            renderIngredients();
          });
        });
      }

      renderRecipe();
    </script>
